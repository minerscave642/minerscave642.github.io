<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Group Chat (GitHub Pages)</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    #chat { display: none; }
    #messages { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; }
    .system { color: gray; font-style: italic; }
    .msg { margin: 5px 0; }
  </style>
</head>
<body>

<h2>Group Chat (No Email Required)</h2>

<div id="login">
  <input id="username" placeholder="Choose a username">
  <button onclick="login()">Login</button>
  <p id="loginError" style="color:red;"></p>
</div>

<div id="chat">
  <p>Logged in as <b id="userDisplay"></b></p>

  <input id="groupName" placeholder="Group name">
  <button onclick="joinGroup()">Join Group</button>

  <h3>Group: <span id="currentGroup">None</span></h3>

  <div id="messages"></div>

  <input id="messageInput" placeholder="Type message..." style="width:70%;">
  <button onclick="sendMessage()">Send</button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>

<script>
  // TODO: Replace with your Firebase config
  const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "YOUR_APP.firebaseapp.com",
    databaseURL: "https://YOUR_APP.firebaseio.com",
    projectId: "YOUR_APP",
    storageBucket: "YOUR_APP.appspot.com",
    messagingSenderId: "YOUR_ID",
    appId: "YOUR_APP_ID"
  };

  const app = firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let username = null;
  let currentGroup = null;

  function login() {
    const name = document.getElementById("username").value.trim();
    if (!name) {
      document.getElementById("loginError").textContent = "Username required";
      return;
    }

    username = name;
    document.getElementById("userDisplay").textContent = username;
    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "block";
  }

  function joinGroup() {
    const group = document.getElementById("groupName").value.trim();
    if (!group) return;

    currentGroup = group;
    document.getElementById("currentGroup").textContent = group;

    document.getElementById("messages").innerHTML = "";

    firebase.database().ref("groups/" + group).on("child_added", (snapshot) => {
      const msg = snapshot.val();
      addMessage(msg.username, msg.text);
    });

    addSystemMessage(username + " joined the group");
  }

  function sendMessage() {
    const text = document.getElementById("messageInput").value.trim();
    if (!text || !currentGroup) return;

    firebase.database().ref("groups/" + currentGroup).push({
      username,
      text
    });

    document.getElementById("messageInput").value = "";
  }

  function addMessage(user, text) {
    const div = document.createElement("div");
    div.className = "msg";
    div.innerHTML = `<b>${user}:</b> ${text}`;
    document.getElementById("messages").appendChild(div);
  }

  function addSystemMessage(text) {
    const div = document.createElement("div");
    div.className = "system";
    div.textContent = text;
    document.getElementById("messages").appendChild(div);
  }
</script>

</body>
</html>
